name: Nightly permits ETL

# Re-pulls every building permit issued since the 2023 ward map, classifies it, resolves demolition
# unit counts against the Cook County Assessor, rebuilds projects, and loads Supabase. Quiet = healthy:
# a failed run goes red and emails; nearly everything self-heals on the next run.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 1:00 am Chicago
  workflow_dispatch: {}

concurrency:
  group: nightly-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    # The zoning stage reads up to 25 scanned exhibits a night with tesseract (about a minute each).
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ZONING_DATABASE_URL: ${{ secrets.ZONING_DATABASE_URL }}
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests for the parsing rules
        run: npm test
      - name: Sync ward boundaries and office websites
        run: npm run sync-wards
      - name: Pull, classify, and load permits
        run: npm run etl
      # The zoning stage: copy zoning matters from chicago-budget (incremental on top of the cached copy, so a
      # fresh runner does not re-copy 200 MB of ordinance text), read them, read a few scanned exhibits with OCR,
      # place and link, load. Runs whether or not the permit step changed anything; a red run is the alarm.
      - name: Install poppler and tesseract for the scanned exhibits
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr
      - name: Restore the last copy of the zoning matters
        uses: actions/cache@v4
        with:
          path: data/cache/zoning-matters.json
          key: zoning-matters-${{ github.run_id }}
          restore-keys: zoning-matters-
      - name: Copy, read, place and link zoning actions
        run: npm run etl-zoning
      - name: Upload the review queues, golden mismatches and drift
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-queue
          path: |
            data/review-queue.csv
            data/golden-mismatches.csv
            data/drift.csv
            data/zoning-review-queue.csv
            data/zoning-golden-mismatches.csv
          if-no-files-found: ignore
